[package]
name = "heroui"
version = "0.1.4"
description = "Lightweight Elm-style UI library on fltk-rs for HeroineOS apps"
repository = "https://github.com/HeroineOS/HeroUI"
license = "MIT OR Apache-2.0"
edition = "2021"

[dependencies]
fltk = "1.5"
# Already built as part of fltk; used for a few raw calls on hot paths.
fltk-sys = "1.5"

[features]
default = ["wayland"]
# Native Wayland (FLTK hybrid build): Wayland when available, X11 otherwise.
wayland = ["fltk/use-wayland"]
# Native panels, desktop widgets and notifications on Wayland
# (wlr-layer-shell). Needs the HeroineOS fltk-sys fork; add to the app's
# Cargo.toml:
#   [patch.crates-io]
#   fltk-sys = { git = "https://github.com/HeroineOS/fltk-sys" }
# Without it (or on compositors without layer-shell, like GNOME), shell
# windows run on XWayland with X11 window hints.
layer-shell = ["wayland"]
# Task::future on a single shared current-thread runtime.
tokio = ["dep:tokio"]

[dependencies.tokio]
version = "1"
optional = true
default-features = false
features = ["rt", "sync"]

# `cargo deb --no-build` after building the examples (see .github/workflows)
# packages them as heroui-demos, to try HeroUI without a Rust toolchain.
[package.metadata.deb]
name = "heroui-demos"
maintainer = "HeroineOS <https://github.com/HeroineOS>"
copyright = "HeroineOS contributors"
section = "x11"
priority = "optional"
depends = "$auto"
extended-description = """\
Example programs of HeroUI, the lightweight UI library of HeroineOS: \
heroui-showcase (widgets tour), heroui-counter, heroui-custom-widget, \
heroui-sysmon (conky-like desktop widget), heroui-panel (a top panel) and \
heroui-scrolling (a long scrolling settings page)."""
assets = [
    ["target/release/examples/showcase", "usr/bin/heroui-showcase", "755"],
    ["target/release/examples/counter", "usr/bin/heroui-counter", "755"],
    ["target/release/examples/custom_widget", "usr/bin/heroui-custom-widget", "755"],
    ["target/release/examples/sysmon", "usr/bin/heroui-sysmon", "755"],
    ["target/release/examples/panel", "usr/bin/heroui-panel", "755"],
    ["target/release/examples/scrolling", "usr/bin/heroui-scrolling", "755"],
    ["README.md", "usr/share/doc/heroui-demos/README.md", "644"],
]
