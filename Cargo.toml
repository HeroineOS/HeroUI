[package]
name = "heroui"
version = "0.1.0"
description = "Lightweight Elm-style UI library on fltk-rs for HeroineOS apps"
repository = "https://github.com/HeroineOS/HeroUI"
license = "MIT OR Apache-2.0"
edition = "2021"

[dependencies]
fltk = "1.5"
# Already built as part of fltk; used for a few raw calls on hot paths.
fltk-sys = "1.5"

[features]
default = []
# Native Wayland backend (FLTK hybrid build). Window hints for panels and
# desktop widgets are X11-only for now and are skipped in this build.
wayland = ["fltk/use-wayland"]
# Task::future on a single shared current-thread runtime.
tokio = ["dep:tokio"]

[dependencies.tokio]
version = "1"
optional = true
default-features = false
features = ["rt", "sync"]
